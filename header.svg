<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05071A"/>
      <stop offset="0.55" stop-color="#0B0F2B"/>
      <stop offset="1" stop-color="#1B2045"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#5A6090" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B0F2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#9AA0BF" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#E6E8F0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6A7099" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C0C4D6"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .ribbon { fill: none; stroke: url(#silver); stroke-linecap: round; }
      .drift  { animation: drift 9s ease-in-out infinite alternate; }
      .drift2 { animation: drift2 11s ease-in-out infinite alternate; }
      .star   { fill: #E6E8F0; animation: tw 3s ease-in-out infinite; }
      .s2 { animation-delay: .8s } .s3 { animation-delay: 1.6s } .s4 { animation-delay: 2.3s }
      .fade   { opacity: 0; animation: in 1.2s ease-out forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.2s }
      @keyframes drift  { from { transform: translate(0,0) } to { transform: translate(28px,-14px) } }
      @keyframes drift2 { from { transform: translate(0,0) } to { transform: translate(-24px,16px) } }
      @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- glass ribbons, top-left -->
    <g class="drift" opacity="0.9">
      <path class="ribbon" stroke-width="2.2" d="M-60 40 C 120 -20, 260 140, 420 60 S 560 -10, 640 30"/>
      <path class="ribbon" stroke-width="1.4" d="M-60 55 C 120 -5, 260 155, 420 75 S 560 5, 640 45"/>
      <path class="ribbon" stroke-width="0.9" d="M-60 70 C 120 10, 260 170, 420 90 S 560 20, 640 60"/>
      <path class="ribbon" stroke-width="0.6" d="M-60 85 C 120 25, 260 185, 420 105 S 560 35, 640 75"/>
      <path class="ribbon" stroke-width="3.5" opacity="0.35" d="M-60 100 C 120 40, 260 200, 420 120 S 560 50, 640 90"/>
    </g>

    <!-- glass ribbons, bottom-left -->
    <g class="drift2" opacity="0.7">
      <path class="ribbon" stroke-width="1.6" d="M-40 360 C 80 260, 200 330, 300 250 S 420 200, 520 240"/>
      <path class="ribbon" stroke-width="1" d="M-40 375 C 80 275, 200 345, 300 265 S 420 215, 520 255"/>
      <path class="ribbon" stroke-width="0.6" d="M-40 390 C 80 290, 200 360, 300 280 S 420 230, 520 270"/>
    </g>

    <!-- glass ribbons, right -->
    <g class="drift2" opacity="0.85">
      <path class="ribbon" stroke-width="2" d="M1260 -20 C 1120 60, 1180 160, 1040 230 S 980 330, 1120 380"/>
      <path class="ribbon" stroke-width="1.2" d="M1275 -10 C 1135 70, 1195 170, 1055 240 S 995 340, 1135 390"/>
      <path class="ribbon" stroke-width="0.8" d="M1290 0 C 1150 80, 1210 180, 1070 250 S 1010 350, 1150 400"/>
      <path class="ribbon" stroke-width="3.5" opacity="0.3" d="M1305 10 C 1165 90, 1225 190, 1085 260 S 1025 360, 1165 410"/>
    </g>

    <!-- stars -->
    <circle class="star"    cx="560" cy="40"  r="1.4"/>
    <circle class="star s2" cx="880" cy="70"  r="1.1"/>
    <circle class="star s3" cx="700" cy="290" r="1.3"/>
    <circle class="star s4" cx="960" cy="250" r="1"/>
    <circle class="star s2" cx="240" cy="200" r="1.2"/>
    <circle class="star s3" cx="420" cy="300" r="1"/>
    <circle class="star"    cx="1000" cy="30" r="1.2"/>

    <!-- text -->
    <g text-anchor="middle">
      <text class="fade d1" x="600" y="118" fill="#A9AEC9" font-family="Consolas, 'Courier New', monospace" font-size="20" letter-spacing="3">// senior full-stack developer</text>
      <text class="fade d2" x="600" y="198" fill="url(#text)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="300" letter-spacing="1">&lt;/&gt; from idea to prod</text>
      <line class="fade d2" x1="430" y1="226" x2="770" y2="226" stroke="#C0C4D6" stroke-opacity="0.4" stroke-width="1"/>
      <text class="fade d3" x="600" y="262" fill="#E6E8F0" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="5">WEB · MOBILE · BACKEND · CLOUD · AI</text>
    </g>
  </g>
</svg>
